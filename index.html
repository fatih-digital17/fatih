<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kas Topup</title>
<style>
:root{
  color-scheme: light;
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#14213D; --muted:#5B6678; --line:#D6DDE8;
  --gain:#14794F; --loss:#C0392B; --accent:#F2B705; --accent-ink:#2B2100; --field:#F6F8FB;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme: dark;
    --bg:#0F1624; --surface:#182134; --ink:#E8EDF7; --muted:#9AA6BC; --line:#2A3650;
    --gain:#4CC38A; --loss:#FF8A7A; --field:#101929;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.45; padding:20px 16px 120px;
  -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0 0 14px;font-weight:700;letter-spacing:-.01em}
h2{font-size:16px;margin:28px 0 10px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;padding:8px 4px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.hero .lbl{color:var(--muted);font-size:14px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px;line-height:1.1}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.rows{border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0;padding-bottom:0}
.row span:first-child{color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item>button.head{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;padding:12px 14px;cursor:pointer}
.item>button.head:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.item .t{font-weight:600;overflow-wrap:anywhere}
.item .s{font-size:13px;color:var(--muted)}
.item .amt{font-weight:700;white-space:nowrap}
.detail{padding:0 14px 12px;font-size:14px}
.detail .row{padding:6px 0}
.del{margin-top:8px;border:1px solid var(--line);background:transparent;color:var(--loss);font:inherit;font-size:14px;padding:7px 12px;border-radius:9px;cursor:pointer}
.del.sure{background:var(--loss);color:#fff;border-color:var(--loss)}
.empty{padding:22px 16px;color:var(--muted);text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;font:inherit;font-weight:700;border-radius:12px;padding:14px 10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.btn.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.overlay{position:fixed;inset:0;background:rgba(10,16,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.overlay.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet h3{margin:0 0 12px;font-size:18px}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus-visible{outline:3px solid var(--accent);outline-offset:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{margin-top:14px;padding:12px;border-radius:10px;background:var(--field);border:1px solid var(--line);display:flex;justify-content:space-between;font-weight:700}
.hint{font-size:13px;color:var(--muted);margin:8px 0 0}
.actions{display:flex;gap:10px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.card .lbl{color:var(--muted);font-size:14px}
.card .val{font-size:22px;font-weight:800;letter-spacing:-.01em}
.mini{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--field);color:var(--ink);border-radius:9px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.mini:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.debt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);margin-top:10px}
.debt .t{font-weight:600;overflow-wrap:anywhere}
.debt .s{font-size:13px;color:var(--muted)}
label.check{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:15px;color:var(--ink)}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
textarea{width:100%;min-height:150px;font:13px ui-monospace,Menlo,monospace;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px;white-space:pre}
.warn{color:var(--loss)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <h1>Kas Topup</h1>
  <div class="seg" id="seg" role="group" aria-label="Periode"></div>
  <div class="hero" id="hero"></div>
  <div id="extra"></div>

  <h2>Produk paling cuan</h2>
  <div class="list" id="top"></div>

  <h2>Riwayat</h2>
  <div class="list" id="hist"></div>
  <button class="btn" id="export" style="margin-top:14px;width:100%">Ekspor data</button>
</div>

<div class="bar"><div class="in">
  <button class="btn main" id="addSale">Catat penjualan</button>
  <button class="btn" id="addCost">Catat pengeluaran</button>
</div></div>

<div class="overlay" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY = 'kas-topup-v1';
let tx = [];
let period = 'bulan';
let openId = null;
let sureId = null;
const mem = {};

const store = {
  async get(){
    try{
      if(window.storage){ const r = await window.storage.get(KEY); return JSON.parse(r.value); }
      const raw = window.localStorage && localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return mem[KEY] || [];
  },
  async set(v){
    mem[KEY] = v;
    try{
      if(window.storage){ await window.storage.set(KEY, JSON.stringify(v)); }
      else if(window.localStorage){ localStorage.setItem(KEY, JSON.stringify(v)); }
    }catch(e){ toast('Gagal menyimpan, coba lagi'); }
  }
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => (n < 0 ? '-' : '') + 'Rp' + Math.abs(n).toLocaleString('id-ID');
const todayStr = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fmtDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); };
const digits = s => parseInt(String(s).replace(/\D/g,''),10) || 0;
const profitOf = t => t.type === 'jual' ? t.harga - t.modal : t.type === 'keluar' ? -t.nominal : 0;

function toast(msg){ const el = $('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove('show'),1800); }

function inPeriod(t){
  if(period === 'semua') return true;
  const now = new Date(); const [y,m,d] = t.date.split('-').map(Number); const dt = new Date(y,m-1,d);
  if(period === 'hari') return t.date === todayStr();
  if(period === 'minggu'){ const from = new Date(now.getFullYear(), now.getMonth(), now.getDate()-6); return dt >= from; }
  return dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth();
}

function render(){
  const periods = [['hari','Hari ini'],['minggu','7 hari'],['bulan','Bulan ini'],['semua','Semua']];
  $('seg').innerHTML = periods.map(([k,l]) => `<button data-p="${k}" aria-pressed="${period===k}">${l}</button>`).join('');

  const list = tx.filter(inPeriod);
  const sales = list.filter(t => t.type === 'jual');
  const omzet = sales.reduce((a,t)=>a+t.harga,0);
  const belum = sales.filter(t=>t.lunas===false).reduce((a,t)=>a+t.harga,0);
  const modal = sales.reduce((a,t)=>a+t.modal,0);
  const biaya = list.filter(t=>t.type==='keluar').reduce((a,t)=>a+t.nominal,0);
  const bersih = omzet - modal - biaya;
  $('hero').innerHTML = `
    <div class="lbl">Untung bersih</div>
    <div class="big num ${bersih<0?'neg':'pos'}">${rp(bersih)}</div>
    <div class="rows">
      <div class="row"><span>Total penjualan (${sales.length})</span><span class="num">${rp(omzet)}</span></div>
      ${belum ? `<div class="row"><span>Di antaranya belum dibayar</span><span class="num warn">${rp(belum)}</span></div>` : ''}
      <div class="row"><span>Modal barang</span><span class="num">${rp(modal)}</span></div>
      <div class="row"><span>Pengeluaran lain</span><span class="num">${rp(biaya)}</span></div>
    </div>`;

  const utang = tx.filter(t=>t.type==='jual' && t.lunas===false).sort((a,b)=>a.date.localeCompare(b.date));
  const totalUtang = utang.reduce((a,t)=>a+t.harga,0);
  const saldo = tx.filter(t=>t.type==='saldo').reduce((a,t)=>a+t.nominal,0) - tx.filter(t=>t.type==='jual').reduce((a,t)=>a+t.modal,0);
  $('extra').innerHTML = `
    <div class="card">
      <div class="top"><div><div class="lbl">Saldo supplier</div><div class="val num ${saldo<0?'warn':''}">${rp(saldo)}</div></div><button class="mini" data-act="saldo">Isi saldo</button></div>
      ${saldo<0 ? '<p class="hint">Minus artinya ada isi saldo yang belum dicatat.</p>' : ''}
    </div>
    ${utang.length ? `<div class="card"><div class="lbl">Belum dibayar pelanggan</div><div class="val num">${rp(totalUtang)}</div>${utang.map(t => `
      <div class="debt"><div><div class="t">${esc(t.customer || t.name)}</div><div class="s">${esc(t.name)} · ${fmtDate(t.date)} · ${rp(t.harga)}</div></div><button class="mini" data-lunas="${t.id}">Tandai lunas</button></div>`).join('')}</div>` : ''}`;

  const byProd = {};
  sales.forEach(t => { const k = t.name.trim().toLowerCase(); (byProd[k] ||= {name:t.name,n:0,u:0}); byProd[k].n++; byProd[k].u += t.harga - t.modal; });
  const prods = Object.values(byProd).sort((a,b)=>b.u-a.u).slice(0,5);
  $('top').innerHTML = prods.length ? prods.map(p => `
    <div class="item"><div class="head" style="display:flex;justify-content:space-between;gap:12px;padding:12px 14px">
      <div><div class="t">${esc(p.name)}</div><div class="s">${p.n}x terjual</div></div>
      <div class="amt num ${p.u<0?'neg':'pos'}">${rp(p.u)}</div></div></div>`).join('')
    : `<div class="empty">Belum ada penjualan di periode ini.</div>`;

  const sorted = [...list].sort((a,b)=> b.date.localeCompare(a.date) || b.id - a.id);
  $('hist').innerHTML = sorted.length ? sorted.map(t => {
    const p = profitOf(t); const isOpen = openId === t.id;
    const title = t.name;
    const tag = {keluar:' · Pengeluaran', saldo:' · Isi saldo supplier'}[t.type] || '';
    const sub = fmtDate(t.date) + (t.type==='jual' ? (t.customer ? ' · ' + esc(t.customer) : '') + (t.lunas===false ? ' · Belum dibayar' : '') : tag);
    const detail = t.type === 'jual'
      ? `<div class="row"><span>Harga jual</span><span class="num">${rp(t.harga)}</span></div><div class="row"><span>Harga modal</span><span class="num">${rp(t.modal)}</span></div>`
      : `<div class="row"><span>Jumlah</span><span class="num">${rp(t.nominal)}</span></div>`;
    return `<div class="item">
      <button class="head" data-open="${t.id}" aria-expanded="${isOpen}">
        <div><div class="t">${esc(title)}</div><div class="s">${sub}</div></div>
        ${t.type==='saldo' ? `<div class="amt num">${rp(t.nominal)}</div>` : `<div class="amt num ${p<0?'neg':'pos'}">${p>0?'+':''}${rp(p)}</div>`}
      </button>
      ${isOpen ? `<div class="detail">${detail}<button class="del ${sureId===t.id?'sure':''}" data-del="${t.id}">${sureId===t.id?'Yakin hapus?':'Hapus catatan'}</button></div>` : ''}
    </div>`; }).join('')
    : `<div class="empty">Belum ada catatan. Setiap ada yang beli, tekan "Catat penjualan".</div>`;
}

function names(type){
  const m = {}; tx.filter(t=>t.type===type).sort((a,b)=>a.id-b.id).forEach(t => m[t.name.toLowerCase()] = t);
  return m;
}

function openSheet(kind){
  const sheet = $('sheet');
  if(kind === 'jual'){
    const opts = Object.values(names('jual')).map(t=>`<option value="${esc(t.name)}">`).join('');
    sheet.innerHTML = `
      <h3>Catat penjualan</h3>
      <label for="fDate">Tanggal</label><input id="fDate" type="date" value="${todayStr()}">
      <label for="fName">Produk</label><input id="fName" list="prodList" placeholder="Contoh: 86 Diamond ML" autocomplete="off"><datalist id="prodList">${opts}</datalist>
      <label for="fCust">Pelanggan (boleh kosong)</label><input id="fCust" placeholder="Nama atau ID">
      <div class="two">
        <div><label for="fModal">Harga modal</label><input id="fModal" inputmode="numeric" placeholder="0"></div>
        <div><label for="fHarga">Harga jual</label><input id="fHarga" inputmode="numeric" placeholder="0"></div>
      </div>
      <label class="check" for="fUtang"><input id="fUtang" type="checkbox"> Pelanggan belum bayar (utang)</label>
      <div class="preview"><span>Untung</span><span id="prev" class="num">Rp0</span></div>
      <p class="hint">Kalau produk pernah dicatat, harga modal dan jual terisi otomatis.</p>
      <div class="actions"><button class="btn" id="cancel">Batal</button><button class="btn main" id="save">Simpan penjualan</button></div>`;
    const upd = () => { const u = digits($('fHarga').value) - digits($('fModal').value); const el = $('prev'); el.textContent = rp(u); el.className = 'num ' + (u<0?'neg':'pos'); };
    ['fModal','fHarga'].forEach(id => $(id).addEventListener('input', e => { const v = digits(e.target.value); e.target.value = v ? v.toLocaleString('id-ID') : ''; upd(); }));
    $('fName').addEventListener('change', e => {
      const t = names('jual')[e.target.value.trim().toLowerCase()];
      if(t){ $('fModal').value = t.modal.toLocaleString('id-ID'); $('fHarga').value = t.harga.toLocaleString('id-ID'); upd(); }
    });
    $('save').onclick = async () => {
      const name = $('fName').value.trim(); const modal = digits($('fModal').value); const harga = digits($('fHarga').value);
      if(!name) return toast('Isi nama produk dulu');
      if(!harga) return toast('Isi harga jual dulu');
      tx.push({id:Date.now(), type:'jual', date:$('fDate').value || todayStr(), name, customer:$('fCust').value.trim(), modal, harga, lunas: !$('fUtang').checked});
      await store.set(tx); closeSheet(); render(); toast('Penjualan tersimpan');
    };
  } else if(kind === 'saldo'){
    sheet.innerHTML = `
      <h3>Isi saldo supplier</h3>
      <label for="fDate">Tanggal</label><input id="fDate" type="date" value="${todayStr()}">
      <label for="fNom">Jumlah yang diisi</label><input id="fNom" inputmode="numeric" placeholder="0">
      <p class="hint">Saldo berkurang otomatis sebesar harga modal tiap penjualan. Isi saldo tidak dihitung sebagai pengeluaran, jadi untungnya tetap akurat.</p>
      <div class="actions"><button class="btn" id="cancel">Batal</button><button class="btn main" id="save">Simpan isi saldo</button></div>`;
    $('fNom').addEventListener('input', e => { const v = digits(e.target.value); e.target.value = v ? v.toLocaleString('id-ID') : ''; });
    $('save').onclick = async () => {
      const nominal = digits($('fNom').value);
      if(!nominal) return toast('Isi jumlahnya dulu');
      tx.push({id:Date.now(), type:'saldo', date:$('fDate').value || todayStr(), name:'Isi saldo supplier', nominal});
      await store.set(tx); closeSheet(); render(); toast('Isi saldo tersimpan');
    };
  } else if(kind === 'export'){
    const jenis = {jual:'Penjualan', keluar:'Pengeluaran', saldo:'Isi saldo'};
    const rows = [['Tanggal','Jenis','Keterangan','Pelanggan','Harga modal','Harga jual','Jumlah','Untung','Status']];
    [...tx].sort((a,b)=> a.date.localeCompare(b.date) || a.id - b.id).forEach(t => rows.push([
      t.date, jenis[t.type], t.name, t.customer || '',
      t.type==='jual' ? t.modal : '', t.type==='jual' ? t.harga : '', t.type!=='jual' ? t.nominal : '',
      profitOf(t), t.type==='jual' ? (t.lunas===false ? 'Belum dibayar' : 'Lunas') : ''
    ]));
    const tsv = rows.map(r => r.map(c => String(c).replace(/\t|\n/g,' ')).join('\t')).join('\n');
    const csv = rows.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\n');
    sheet.innerHTML = `
      <h3>Ekspor data</h3>
      <p class="hint" style="margin:0 0 10px">${tx.length} catatan. Salin lalu tempel ke Excel atau Google Sheets, atau unduh sebagai file CSV.</p>
      <textarea id="fOut" readonly></textarea>
      <div class="actions"><button class="btn" id="cancel">Tutup</button><button class="btn" id="dl">Unduh CSV</button><button class="btn main" id="copy">Salin</button></div>`;
    $('fOut').value = tsv;
    $('copy').onclick = async () => {
      try{ await navigator.clipboard.writeText(tsv); toast('Tersalin'); }
      catch(e){ const ta = $('fOut'); ta.focus(); ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(_){} toast(ok ? 'Tersalin' : 'Tahan teks lalu pilih Salin'); }
    };
    $('dl').onclick = () => {
      try{
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], {type:'text/csv;charset=utf-8'}));
        a.download = 'kas-topup-' + todayStr() + '.csv';
        document.body.appendChild(a); a.click(); a.remove();
      }catch(e){ toast('Unduh gagal, pakai tombol Salin'); }
    };
  } else {
    const opts = ['Iklan','Biaya admin','Paket data','Lainnya'].map(o=>`<option value="${o}">`).join('');
    sheet.innerHTML = `
      <h3>Catat pengeluaran</h3>
      <label for="fDate">Tanggal</label><input id="fDate" type="date" value="${todayStr()}">
      <label for="fName">Keterangan</label><input id="fName" list="costList" placeholder="Contoh: Iklan" autocomplete="off"><datalist id="costList">${opts}</datalist>
      <label for="fNom">Jumlah</label><input id="fNom" inputmode="numeric" placeholder="0">
      <p class="hint">Modal barang sudah dihitung di tiap penjualan. Isi di sini cuma biaya lain, seperti iklan atau biaya admin.</p>
      <div class="actions"><button class="btn" id="cancel">Batal</button><button class="btn main" id="save">Simpan pengeluaran</button></div>`;
    $('fNom').addEventListener('input', e => { const v = digits(e.target.value); e.target.value = v ? v.toLocaleString('id-ID') : ''; });
    $('save').onclick = async () => {
      const name = $('fName').value.trim(); const nominal = digits($('fNom').value);
      if(!name) return toast('Isi keterangannya dulu');
      if(!nominal) return toast('Isi jumlahnya dulu');
      tx.push({id:Date.now(), type:'keluar', date:$('fDate').value || todayStr(), name, nominal});
      await store.set(tx); closeSheet(); render(); toast('Pengeluaran tersimpan');
    };
  }
  $('cancel').onclick = closeSheet;
  $('ov').classList.add('open');
  setTimeout(()=>{ const f = $('fName') || $('fNom'); f && f.focus(); }, 50);
}
function closeSheet(){ $('ov').classList.remove('open'); }

$('addSale').onclick = () => openSheet('jual');
$('addCost').onclick = () => openSheet('keluar');
$('export').onclick = () => openSheet('export');
$('extra').addEventListener('click', async e => {
  if(e.target.closest('[data-act="saldo"]')) return openSheet('saldo');
  const l = e.target.closest('[data-lunas]');
  if(l){
    const t = tx.find(x => x.id === Number(l.dataset.lunas));
    if(t){ t.lunas = true; await store.set(tx); render(); toast('Ditandai lunas'); }
  }
});
$('ov').addEventListener('click', e => { if(e.target.id === 'ov') closeSheet(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });
$('seg').addEventListener('click', e => { const b = e.target.closest('button'); if(!b) return; period = b.dataset.p; openId = null; sureId = null; render(); });
$('hist').addEventListener('click', async e => {
  const o = e.target.closest('[data-open]');
  const d = e.target.closest('[data-del]');
  if(d){
    const id = Number(d.dataset.del);
    if(sureId === id){ tx = tx.filter(t => t.id !== id); sureId = null; openId = null; await store.set(tx); toast('Catatan dihapus'); }
    else sureId = id;
    return render();
  }
  if(o){ const id = Number(o.dataset.open); openId = openId === id ? null : id; sureId = null; render(); }
});

(async () => { tx = await store.get(); render(); })();
</script>
</body>
</html>
